# Example Archipelago player config for ARK: Survival Evolved.
# Put this in your Archipelago "Players/" folder before generating.
name: Ghios
game: ARK Survival Evolved
ARK Survival Evolved:
  # Which map(s) your server runs. List more than one for a CLUSTER (maps linked by
  # obelisk/transmitter travel) and their content pools together.
  # SHIPPED: the_island, scorched_earth, ragnarok - each one verified to generate ON ITS OWN, so
  # listing a single map is never a limitation. The rest of the keys are reserved and have no data.
  # Anything you do not list is filtered out: its checks never appear, its items never enter the
  # pool, and the goal only asks for bosses your maps actually have.
  #   the_island | scorched_earth | aberration | extinction | genesis_part_1 | genesis_part_2 |
  #   lost_colony | the_center | ragnarok | valguero | crystal_isles | lost_island | fjordur | astraeos
  maps:
    - the_island
  # Win: defeat these bosses (any difficulty). Cumulative over the Island's four; on a map without
  # them it means that map's own bosses instead (Scorched alone = the Manticore).
  #   broodmother | broodmother_megapithecus | broodmother_megapithecus_dragon | all_bosses |
  #   all_bosses_all_maps  (every boss on the maps you enabled)
  goal: all_bosses
  # Die when a linked player in another game dies (and send yours to them).
  death_link: true
  # Taming a creature requires its "Tame: X" item first. Off = tame anything from the start
  # (its "Tamed: X" check still fires, and the craft/weapon logic below still applies).
  lock_taming: true
  # Supply crates / beacons stay locked until you receive their access item.
  lock_supply_crates: true
  # Bundle each dino's saddle with its tame unlock (the saddle leaves the item pool).
  # Saddles matter to the logic now: fighting from a mount needs "tame + its saddle", so kills and
  # caves that call for a mount require both. On = one item covers both, a smaller pool and slightly
  # looser logic. Off = saddles are separate items you hunt for.
  bundle_saddles: false
  # Free-grant basic starter engrams at start + remove them from the pool.
  free_starter_engrams: false
  # Start with these items already received + removed from the pool. Quote names:
  #   start_inventory_from_pool:
  #     "Engram: Slingshot": 1
  start_inventory_from_pool: {}
  # % of filler slots that are traps (wild dino spawns) vs Bonus Resources/kibble/etc.
  trap_percentage: 25
  # Tech-tree progression (RECOMMENDED, default on). Splits checks into 4 tier REGIONS opened in
  # order (Menu -> T0 -> T1 -> T2 -> T3), each gated by the prior tier's station engram:
  #   T1 = Forge + Mortar And Pestle | T2 = Anvil Bench (Smithy) | T3 = Fabricator.
  #   Explorer notes open at T2. Order follows ARK's craft chain: the Smithy costs metal
  #   ingots, so it needs the Forge first.
  # This is what makes the seed play out sphere-by-sphere; OFF = almost everything reachable at once
  # (playthrough collapses to ~1 sphere). Gate engrams are normal progression items - fill keeps
  # each reachable before its tier. Tame/kill/cave logic still applies on top.
  progression_tiers: true
  # Softlock-safe ordering is AUTOMATIC and needs no configuring. Every check carries the real
  # requirement for doing it: taming a Rex needs the Crossbow chain, KILLING one needs a strong
  # mount or a rifle/shotgun, and an artifact cave needs its gear plus a suitable mount. So the
  # fill can never strand a needed item behind something you cannot do yet.
  #
  # Force extra specific items early. Quote names:
  #   extra_early_items:
  #     - "Engram: Bow"
  extra_early_items: []
  # Where extra_early_items land: local_early = early in YOUR world | global_early = early anywhere.
  station_placement: local_early
  # Nudge a creature's assumed taming difficulty for the access logic. add -> treat as no-requirement
  # (Tier 0), remove -> bump a default-Tier-0 creature up to needing an early KO method:
  #   tier0_add: [Carno]
  #   tier0_remove: [Coelacanth]
  tier0_add: []
  tier0_remove: []
  # Explorer-note checks to include, counted per slot from the notes YOUR maps have:
  # the Island 232, Scorched Earth 137, Ragnarok ~none of its own - 370 across all three.
  # The cap is applied AFTER the map filter, so a value above your total harmlessly caps there;
  # 400 just means "all of them". Keep it near the maximum unless you know what you are doing -
  # ARK's pool needs most of the notes plus the other locations to fit, and a low value can fail
  # generation. Lowering it on a CLUSTER silently drops that map's notes off the end of the list.
  dossier_checks: 400
  # Percent of the 14 food "hold N in inventory" checks included (0/25/50/75/100).
  food_sanity: 100
  # Percent of per-species "Tamed: X" checks required (25/50/75/100). Lower = fewer required
  # tames; every Tame unlock item stays in the pool either way.
  tame_sanity: 100
  # Percent of the 10 cause-of-death checks included (0/25/50/75/100). 0 = none at all. These can
  # hold progression, so a seed may want you to die on purpose - set 0 if that is not for you.
  death_sanity: 100
  # The cumulative "die once / 5 / 10 / 25 / 40 times" milestones. Separate from death_sanity
  # because these reward dying repeatedly rather than just dying. false = leave them out.
  death_milestones: true
  # Mod IDs to include (comma-separated). Supported: 731604991/1999447172 Structures Plus/Super
  # Structures (needs bundle_structures: true), 1565015734 Krakens Better Dinos, 821530042 Upgrade
  # Station, 2594067220 Super Spyglass Plus, 1609138312 Dino Storage v2, 889745138 Awesome
  # Teleporters, 1631378184 Explorer Note Tracker, 1404697612 Awesome SpyGlass, 1967741708 Lethal's
  # Reusables. Unknown IDs error.
  #   mod_ids: 731604991, 1631378184, 2594067220, 821530042, 1609138312, 1565015734, 1404697612, 889745138, 1967741708
  mod_ids: []
  # One item unlocks ALL structures of a material (Wood/Stone/Metal/Greenhouse/Tek/Thatch bundles):
  # 197 engrams collapse into 6 items. Crafting stations + utility structures (Mortar And Pestle,
  # Cooking Pot, Campfire, Crop Plots...) stay individual. Shrinks the item pool by ~190.
  bundle_structures: false
  # Group unlocks so ONE item unlocks several at once (1 = off; 2-4 = fold that many together).
  # engrams_per_item groups engrams in progression order; tames_per_item groups tames within a
  # progression tier. Shrinks the item pool a lot (freed slots become filler); logic + the plugin
  # follow automatically. 'Tame N Species' milestones become filler-only when tames_per_item > 1.
  engrams_per_item: 1
  tames_per_item: 1
  # FULLY randomize which species live where: each biome's spawn roster is replaced by a seeded
  # hand of species; every species still spawns somewhere (checks stay obtainable).
  # off | grouped (habitat-appropriate + predators kept rare) | chaos (anything anywhere, equal
  # odds - predator walls included). Bosses/alphas/tek/caves/specialty spawners never touched.
  # After you /connect, the plugin asks you to type /confirm: that writes the Game.ini lines and
  # restarts the server with a forced wild-dino wipe so the new rosters apply. One time per seed.
  randomize_dino_spawns: off
